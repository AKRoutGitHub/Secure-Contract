version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: secure-contract-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: secure_contract
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    image: redis:7
    container_name: secure-contract-redis
    ports:
      - "6379:6379"
volumes:
  pgdata:
