<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure-Contract Pipeline</title>
  </head>

  <body>
    <h2>Start Security Audit</h2>

    <form id="scanForm">
      <div>
        <label for="address">Ethereum Contract Address:</label>
        <input
          type="text"
          id="address"
          name="address"
          placeholder="0xdAC17F..."
          pattern="^0x[a-fA-F0-9]{40}$"
          title="Enter a valid Ethereum address"
        />
      </div>

      <p><strong>OR</strong></p>

      <div>
        <label for="contractFile">Upload .sol File:</label>
        <input
          type="file"
          id="contractFile"
          name="contractFile"
          accept=".sol"
        />
      </div>

      <br />

      <button type="submit">Submit</button>
    </form>

    <!-- Processing dashboard -->
    <div id="processingState" hidden>
      <h2>Audit in Progress</h2>

      <p>Your smart contract is being analyzed for security vulnerabilities.</p>

      <p>
        Status:
        <strong>Processing...</strong>
      </p>

      <p>
        Audit ID:
        <code id="processingAuditId"></code>
      </p>
    </div>

    <div
      id="output"
      style="
        margin-top: 20px;
        padding: 10px;
        background: #f4f4f4;
        white-space: pre-wrap;
        font-family: monospace;
      "
    ></div>

    <script>
      function showProcessingState(auditId) {
        const form = document.getElementById("scanForm");
        const processingState = document.getElementById("processingState");
        const processingAuditId = document.getElementById("processingAuditId");
        const outputDiv = document.getElementById("output");

        form.hidden = true;
        outputDiv.hidden = true;

        processingAuditId.textContent = auditId;
        processingState.hidden = false;
      }

      document
        .getElementById("scanForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const addressInput = document.getElementById("address").value;
          const fileInput = document.getElementById("contractFile").files[0];
          const outputDiv = document.getElementById("output");

          const ethereumAddressRegex = /^0x[a-fA-F0-9]{40}$/;

          outputDiv.hidden = false;
          outputDiv.textContent = "Processing request...";

          const formData = new FormData();

          // Prioritize the file if both are filled out
          if (fileInput) {
            formData.append("contractFile", fileInput);
          } else if (addressInput) {
            if (!ethereumAddressRegex.test(addressInput.trim())) {
              outputDiv.textContent =
                "Error: Please enter a valid Ethereum contract address.";
              return;
            }

            formData.append("address", addressInput.trim());
          } else {
            outputDiv.textContent =
              "Error: Please provide a contract address or upload a file.";
            return;
          }

          try {
            const response = await fetch("/api/audits", {
              method: "POST",
              body: formData,
            });

            const result = await response.json();

            if (response.ok) {
              showProcessingState(result.audit_id);
              return;
            }

            outputDiv.textContent = JSON.stringify(result, null, 2);
          } catch (error) {
            outputDiv.textContent = "Network Error: " + error.message;
          }
        });
    </script>
  </body>
</html>
